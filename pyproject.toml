[project]
name = "dj-is-hung"
version = "0.1.0"
description = "Breakout Matching prototype: AI twins date in the Garden"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "google-cloud-firestore>=2.19",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["garden", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
